<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>POS System Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1e6d8a",
                        "background-light": "#f6f7f8",
                        "background-dark": "#121c20",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen font-display flex items-center justify-center p-4">
    <!-- Main Container -->
    <div
        class="w-full max-w-[480px] bg-white dark:bg-[#1a262b] rounded-xl shadow-lg overflow-hidden border border-slate-200 dark:border-slate-700">
        <!-- Header / Logo Area -->
        <div class="w-full bg-center bg-no-repeat bg-cover h-48 relative"
            data-alt="Modern hardware tools organized on a workbench"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAeQ_3vah-xjtxCJUyJYv-cc8X0gY8Pno-skh2tdsceopUuriEOdTISF0qGoON_DU5VVZBzx84au0d4JReEeMLsvBZZitKpDMkoHab-scGKQXK1ZD9b6o7k9Xc_qpEfk96xtGLXG7o2UMfMAmH95wX825yvHSr15g73bb555cI6ty_RjEU8p3Z29JIrPAwjoZHP4pESTu35mruJybItIjGUHkwTDYsKUmndPqBh6mxfP6iYHdVe9GbUr1ck_lwAp4tTLFZY4kN81NJx");'>
            <div class="absolute inset-0 bg-primary/40 backdrop-blur-[2px]"></div>
            <div class="absolute inset-0 flex items-center justify-center flex-col">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-md mb-2">
                    <span class="material-symbols-outlined text-primary text-4xl">construction</span>
                </div>
                <h1 class="text-white text-2xl font-bold tracking-tight shadow-black/20 drop-shadow-md">HardwarePro POS
                </h1>
            </div>
        </div>
        <div class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight">Welcome Back</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Sign in to access the point of sale system
                </p>
            </div>
            <form class="flex flex-col gap-5">
                <!-- Email Input -->
                <label class="flex flex-col gap-1.5">
                    <span class="text-slate-900 dark:text-slate-100 text-sm font-medium">Email Address</span>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400">
                            <span class="material-symbols-outlined text-[20px]">mail</span>
                        </span>
                        <input
                            class="form-input flex w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#253238] text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 focus:border-primary h-12 pl-11 pr-4 text-sm font-normal transition-all placeholder:text-slate-400"
                            placeholder="employee@hardwarepro.com" type="email" />
                    </div>
                </label>
                <!-- Password Input -->
                <label class="flex flex-col gap-1.5">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-900 dark:text-slate-100 text-sm font-medium">Password</span>
                        <a class="text-primary hover:text-primary/80 text-xs font-medium transition-colors"
                            href="#">Forgot password?</a>
                    </div>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </span>
                        <input
                            class="form-input flex w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-[#253238] text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 focus:border-primary h-12 pl-11 pr-12 text-sm font-normal transition-all placeholder:text-slate-400"
                            placeholder="Enter your password" type="password" />
                        <button
                            class="absolute right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none flex items-center justify-center"
                            type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                </label>
                <!-- Login Button -->
                <button
                    class="w-full bg-primary hover:bg-[#165a73] text-white font-medium h-12 rounded-lg shadow-sm hover:shadow-md transition-all active:scale-[0.98] mt-2 flex items-center justify-center gap-2"
                    type="button">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-lg">login</span>
                </button>
            </form>
            <div class="mt-8 text-center border-t border-slate-200 dark:border-slate-700 pt-6">
                <p class="text-slate-500 dark:text-slate-400 text-xs">
                    Need help accessing your account? <br /> Contact the <a
                        class="text-primary hover:underline font-medium" href="#">IT Support Desk</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
